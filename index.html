<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track your daily habits with calendar checkboxes">
    <meta name="theme-color" content="#4CAF50">
    <title>Daily Habit Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>Habit Tracker</h1>
            <div class="header-actions">
                <button id="menuBtn" class="menu-btn" aria-label="Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="1"></circle>
                        <circle cx="12" cy="5" r="1"></circle>
                        <circle cx="12" cy="19" r="1"></circle>
                    </svg>
                </button>
                <button id="addHabitBtn" class="add-btn" aria-label="Add new habit">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Menu Dropdown -->
        <div id="menuDropdown" class="menu-dropdown">
            <button id="exportBtn" class="menu-item">
                <span>📥</span> Export Data
            </button>
            <button id="importBtn" class="menu-item">
                <span>📤</span> Import Data
            </button>
        </div>
        <input type="file" id="importFileInput" accept=".json" style="display: none;">

        <div id="habitSelector" class="habit-selector">
            <!-- Habit tabs will be dynamically added here -->
        </div>

        <div id="viewSelector" class="view-selector">
            <button class="view-tab active" data-view="calendar">📅 Calendar</button>
            <button class="view-tab" data-view="weekly">📊 Weekly</button>
            <button class="view-tab" data-view="yearly">📆 Yearly</button>
            <button class="view-tab" data-view="graph">📈 Graph</button>
        </div>

        <div id="habitView" class="habit-view">
            <!-- Selected view will be rendered here -->
        </div>

        <div id="emptyState" class="empty-state">
            <p>No habits yet. Click the + button to add your first habit!</p>
        </div>
    </div>

    <!-- Add/Edit Habit Modal -->
    <div id="habitModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">New Habit</h2>
            <div class="form-group">
                <label for="habitNameInput">Habit Name</label>
                <input
                    type="text"
                    id="habitNameInput"
                    placeholder="e.g., Daily Meditation"
                    maxlength="50"
                    autocomplete="off"
                >
            </div>
            <div class="form-group">
                <label for="habitGoalInput">Goal (optional)</label>
                <input
                    type="text"
                    id="habitGoalInput"
                    placeholder="e.g., 2 minutes of meditation every day"
                    maxlength="100"
                    autocomplete="off"
                >
            </div>
            <div class="form-group">
                <label for="habitStartDate">Start Date</label>
                <input
                    type="date"
                    id="habitStartDate"
                >
            </div>
            <div class="modal-buttons">
                <button id="deleteHabitBtn" class="btn btn-danger" style="display:none;">Delete</button>
                <div style="flex: 1;"></div>
                <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
                <button id="saveHabitBtn" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
